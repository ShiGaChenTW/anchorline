<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Task Tracking · Anchorline</title>
<link rel="stylesheet" href="shared.css" />
<style>
  /* 三欄：計劃清單｜這一份的內容｜結構檢查。
     刻意不用 mono 當全頁字體 —— mono 是給路徑、雜湊、程式碼的，
     整頁套上只是在扮演「技術感」，代價是所有字都同一個重量、掃不動。 */
  .tk-shell {
    display: grid;
    grid-template-columns: 268px minmax(0, 1fr) 300px;
    min-height: 0;
    height: 100%;
  }
  @media (max-width: 1080px) {
    .tk-shell { grid-template-columns: 240px minmax(0, 1fr); }
    .tk-side { display: none; }
  }
  @media (max-width: 820px) {
    .tk-shell { grid-template-columns: 1fr; }
    .tk-rail { max-height: 34vh; }
  }
  .tk-rail, .tk-main, .tk-side { overflow: auto; min-height: 0; }
  .tk-rail { border-right: 1px solid var(--border); background: var(--surface); }
  .tk-main { background: var(--bg); }
  .tk-side { border-left: 1px solid var(--border); background: var(--surface); }

  .tk-hd {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    background: inherit;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .tk-hd .mono { font-family: var(--mono); font-weight: 400; font-size: 11px; }

  /* ── 計劃清單：分組，未完成的組預設展開 ── */
  .tk-group { border-bottom: 1px solid var(--border-muted); }
  .tk-group > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
  }
  .tk-group > summary::-webkit-details-marker { display: none; }
  .tk-group > summary:hover { color: var(--fg-2); }
  .tk-count {
    margin-left: auto;
    padding: 0 6px;
    border-radius: 4px;
    background: var(--inset);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .tk-rows { padding: 0 6px 8px; display: flex; flex-direction: column; gap: 1px; }
  .tk-row {
    display: block;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    border-radius: 7px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 160ms ease;
  }
  .tk-row:hover { background: var(--inset); }
  .tk-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tk-row.on { background: color-mix(in oklab, var(--accent) 15%, transparent); }
  .tk-row-t {
    display: block;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--fg-2);
  }
  .tk-row.on .tk-row-t { color: var(--fg); font-weight: 600; }
  /* agent 正在寫的那一份：左緣一條線比一個 6px 圓點好認 */
  .tk-row.tracked { box-shadow: inset 2px 0 0 var(--accent); }
  .tk-row-m { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
  .tk-mini {
    flex: 1 1 auto;
    height: 3px;
    border-radius: 99px;
    background: var(--inset);
    overflow: hidden;
  }
  .tk-mini > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .tk-num {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .tk-num--none { font-family: inherit; }

  /* ── 中欄 ── */
  .tk-body { padding: 22px 26px 40px; }
  .tk-title {
    margin: 0 0 16px;
    font-size: 21px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.3;
    color: var(--fg);
    max-width: 34ch;
  }

  /* 「現在該做什麼」—— 這一頁唯一該先被讀到的東西 */
  .tk-do {
    padding: 14px 16px;
    border: 1px solid color-mix(in oklab, var(--accent) 34%, var(--border));
    border-radius: 10px;
    background: color-mix(in oklab, var(--accent) 9%, transparent);
    margin-bottom: 18px;
  }
  .tk-do-k {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  .tk-do-what {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--fg);
    max-width: 52ch;
  }
  .tk-do-clear { color: var(--success); }
  .tk-do-why {
    margin: 6px 0 0;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 60ch;
  }
  .tk-do-why code, .tk-empty code {
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--inset);
    font-family: var(--mono);
    font-size: 11.5px;
  }

  .tk-prog { margin-bottom: 22px; }
  .tk-bar { height: 6px; border-radius: 99px; background: var(--inset); overflow: hidden; }
  .tk-bar > i {
    display: block;
    height: 100%;
    border-radius: 99px;
    background: var(--accent);
    transition: width 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .tk-prog-m { margin: 7px 0 0; font-size: 12px; color: var(--muted); }
  .tk-prog-m strong { color: var(--fg); font-variant-numeric: tabular-nums; }

  /* 步驟：未完成排前面，完成的降低對比但不刪除 */
  .tk-step {
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr);
    gap: 10px;
    align-items: start;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-muted);
  }
  .tk-step-mark {
    margin-top: 4px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1.5px solid var(--meta);
  }
  .tk-step.pending .tk-step-mark { border-color: var(--accent); }
  .tk-step.done .tk-step-mark { border-color: var(--success); background: var(--success); }
  .tk-step.skipped .tk-step-mark { border-style: dashed; }
  .tk-step-t { font-size: 13.5px; line-height: 1.6; color: var(--fg-2); max-width: 74ch; }
  .tk-step.done .tk-step-t { color: var(--muted); }
  .tk-step.skipped .tk-step-t { color: var(--meta); text-decoration: line-through; }

  /* 空狀態要教怎麼做，不是只說「沒有」 */
  .tk-empty { padding: 18px 4px; max-width: 56ch; }
  .tk-empty p { margin: 0 0 8px; font-size: 13px; line-height: 1.65; color: var(--fg-2); }
  .tk-empty-how { color: var(--muted) !important; font-size: 12.5px !important; }
  .tk-code {
    margin: 6px 0 0;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--inset);
    overflow-x: auto;
  }
  .tk-code code { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--fg-2); }

  /* ── 右欄：結構檢查 ── */
  .tk-side-body { padding: 12px 14px 24px; }
  .tk-gate {
    padding: 12px 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 8px;
  }
  .tk-gate--block { border-color: color-mix(in oklab, var(--danger, #f85149) 45%, var(--border)); }
  .tk-gate--warn { border-color: color-mix(in oklab, var(--warn) 40%, var(--border)); }
  .tk-gate-lv { margin: 0 0 5px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; }
  .tk-gate--block .tk-gate-lv { color: var(--danger, #f85149); }
  .tk-gate--warn .tk-gate-lv { color: var(--warn); }
  .tk-gate-t { margin: 0 0 4px; font-size: 13px; font-weight: 600; line-height: 1.45; color: var(--fg); }
  .tk-gate-d { margin: 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .tk-gate-rest > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
  }
  .tk-gate-rest > summary::-webkit-details-marker { display: none; }
  .tk-gate-rest > summary:hover { color: var(--fg-2); }
  .tk-gate-ok { padding: 12px 4px; font-size: 12.5px; color: var(--success); }

  .tk-layers { display: flex; flex-direction: column; gap: 1px; margin: 18px 0 0; }
  .tk-layer {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--meta);
  }
  .tk-layer-c { font-family: var(--mono); font-size: 10.5px; }
  .tk-layer.done { color: var(--fg-2); }
  .tk-layer.done .tk-layer-c { color: var(--success); }
  .tk-layer.active {
    background: color-mix(in oklab, var(--accent) 13%, transparent);
    color: var(--fg);
    font-weight: 600;
  }
  .tk-layer.active .tk-layer-c { color: var(--accent); }

  .tk-facts { margin: 18px 0 0; display: grid; gap: 10px; }
  .tk-facts dt { font-size: 10.5px; letter-spacing: 0.04em; color: var(--muted); }
  .tk-facts dd { margin: 3px 0 0; font-size: 12.5px; line-height: 1.55; color: var(--fg-2); }

  /* ── 底部狀態列 ── */
  .tk-footer {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: 11.5px;
    color: var(--muted);
  }
  .tk-foot-sp { flex: 1 1 auto; }
  .tk-keys { display: flex; align-items: center; gap: 4px; }
  .tk-keys kbd {
    padding: 1px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--fg-2);
  }
  .tk-foot-live { color: var(--fg-2); }
  @media (prefers-reduced-motion: reduce) {
    .tk-row, .tk-bar > i { transition: none; }
  }
</style>
<script>(function(){try{var t=localStorage.getItem("anchorline:theme")||localStorage.getItem("specforge:theme");if(t==="warp")t="terminal";if(t==="claude")t="kami";var m={kami:["light","#f5f4ed"],github:["dark","#0d1117"],terminal:["dark","#0d0b08"]};if(!m[t])t="terminal";var r=document.documentElement;r.setAttribute("data-theme",t);r.style.colorScheme=m[t][0];r.style.background=m[t][1];}catch(e){document.documentElement.setAttribute("data-theme","terminal");}})();</script>
</head>
<body>
<div class="app">
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand">
        <div class="rail-logo">AL</div>
        <div class="rail-brand-text">
          <strong>Anchorline</strong>
          <span>anchorline.local</span>
        </div>
      </div>
      <div class="rail-theme-row">
        <div class="theme-switch rail-theme-switch" data-theme-switch data-od-id="theme-switch" role="group" aria-label="設計主題">
          <button type="button" data-theme-value="kami" aria-pressed="false">LIGHT</button>
          <button type="button" data-theme-value="github" aria-pressed="true">DARK</button>
          <button type="button" data-theme-value="terminal" aria-pressed="false">TERMINAL</button>
        </div>
      </div>
      <nav class="rail-nav">
        <div class="nav-label">工作區</div>
        <a class="nav-item" href="editor.html">編輯工作台</a>
        <a class="nav-item" href="templates.html">章節範本</a>
        <a class="nav-item" href="review.html">審閱佇列</a>
        <a class="nav-item active" href="tracking.html">計劃追蹤</a>
        <a class="nav-item" href="settings.html">偏好設定</a>
      </nav>
      <div class="rail-foot rail-foot--user" aria-label="目前使用者">
        <div class="rail-user">
          <div class="avatar" data-user-avatar aria-hidden="true">S</div>
          <div class="rail-user-body">
            <div class="rail-user-top">
              <div class="rail-foot-meta" data-user-meta>
                <div class="rail-foot-name">—</div>
                <div class="rail-foot-title">—</div>
              </div>
              <button type="button" class="btn btn-sm btn-ghost btn-logout" data-logout title="登出">登出</button>
            </div>
            <div class="rail-user-role-row">
              <span class="role-badge role-tone-editor" data-user-role-badge>—</span>
              <span class="rail-user-kind" data-user-kind>人員</span>
            </div>
            <div class="rail-user-perms" data-user-perms role="list" aria-label="權限摘要">
              <span class="perm-chip" role="listitem">—</span>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <main class="main" style="overflow:hidden;display:flex;flex-direction:column">
      <div class="toolbar">
        <div>
          <h1>Task Tracking</h1>
          <div class="sub">這個專案 <code>plans/</code> 底下每份計劃的進度。左緣有線的那一份是 agent 此刻正在寫的。</div>
        </div>
        <div class="spacer"></div>
        <button type="button" class="btn" id="btn-refresh">重新整理</button>
        <a class="btn btn-ghost" href="editor.html">回編輯器</a>
      </div>
      <div class="content" style="padding:0;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column">
        <div class="tk-shell" style="flex:1">
          <div class="tk-rail">
            <div class="tk-hd">計劃</div>
            <div id="plan-list"></div>
          </div>
          <div class="tk-main">
            <div class="tk-hd" id="plan-hd">還沒選計劃</div>
            <div class="tk-body">
              <div id="plan-summary"></div>
              <div id="step-list"></div>
            </div>
          </div>
          <div class="tk-side">
            <div class="tk-hd">結構檢查</div>
            <div class="tk-side-body">
              <div id="gate-panel"></div>
              <div id="layer-panel"></div>
              <div id="audit-panel"></div>
            </div>
          </div>
          <div class="tk-footer" id="tui-footer"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/src/pages/tracking.ts"></script>
</body>
</html>
