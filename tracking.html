<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>計劃追蹤 · SpecForge + SCVB</title>
<link rel="stylesheet" href="shared.css" />
<style>
  .tui-shell {
    display: grid;
    grid-template-columns: 260px 1fr 280px;
    min-height: 0;
    height: 100%;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  @media (max-width: 960px) {
    .tui-shell { grid-template-columns: 1fr; }
    .tui-side, .tui-rail { max-height: 200px; }
  }
  .tui-rail, .tui-main, .tui-side {
    border-right: 1px solid var(--border);
    overflow: auto;
    background: var(--bg);
  }
  .tui-side { border-right: 0; background: var(--surface); }
  .tui-panel-hd {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 11px;
    position: sticky;
    top: 0;
    background: inherit;
    z-index: 1;
  }
  .tui-plan-item {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: var(--fg);
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border-muted);
    font: inherit;
  }
  .tui-plan-item:hover { background: var(--inset); }
  .tui-plan-item.active {
    background: var(--accent-soft);
    border-left: 2px solid var(--accent);
  }
  .tui-plan-item .t { font-weight: var(--weight-em); color: var(--fg); margin-bottom: 4px; }
  .tui-plan-item .m { color: var(--muted); font-size: 11px; }
  .tui-bar {
    height: 8px;
    background: var(--inset);
    border-radius: 99px;
    overflow: hidden;
    margin: 8px 0;
  }
  .tui-bar > i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
  }
  .tui-step {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-muted);
    align-items: start;
  }
  .tui-step.done { color: var(--muted); }
  .tui-step.done .mark { color: var(--success); }
  .tui-step.pending .mark { color: var(--accent); }
  .tui-step.skipped { text-decoration: line-through; color: var(--meta); }
  .tui-meta-card {
    margin: 10px 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
  }
  .tui-meta-card .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
  .tui-meta-card .v { margin-top: 4px; color: var(--fg); line-height: 1.4; }
  .tui-footer {
    grid-column: 1 / -1;
    border-top: 1px solid var(--border);
    padding: 6px 12px;
    color: var(--muted);
    font-size: 11px;
    background: var(--surface);
  }
  .gate-list { padding: 8px 12px 20px; }
  .gate-item {
    display: flex;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border-muted);
    font-size: 12px;
  }
  .gate-item .lv { font-size: 10px; min-width: 42px; }
</style>
<script>(function(){try{var t=localStorage.getItem("specforge:theme");var m={warp:["dark","#161412"],kami:["light","#f5f4ed"],github:["dark","#0d1117"],claude:["light","#f5f4ed"]};if(!m[t])t="warp";var r=document.documentElement;r.setAttribute("data-theme",t);r.style.colorScheme=m[t][0];r.style.background=m[t][1];}catch(e){document.documentElement.setAttribute("data-theme","warp");}})();</script>
</head>
<body>
<div class="app">
  <div class="titlebar">
    <div class="traffic" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="titlebar-title">PM-SPEC+SCVB — 計劃追蹤（SCVB tracking）</div>
    <div class="titlebar-meta">
      <div class="theme-switch" data-theme-switch role="group" aria-label="設計主題">
        <button type="button" data-theme-value="warp" aria-pressed="true">Warp</button>
        <button type="button" data-theme-value="kami" aria-pressed="false">kami</button>
        <button type="button" data-theme-value="github" aria-pressed="false">GitHub</button>
        <button type="button" data-theme-value="claude" aria-pressed="false">Claude</button>
      </div>
    </div>
  </div>
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand">
        <div class="rail-logo">PR</div>
        <div><strong>SpecForge</strong><span>PM-SPEC+SCVB</span></div>
      </div>
      <nav class="rail-nav">
        <div class="nav-label">工作區</div>
        <a class="nav-item" href="projects.html">專案列表</a>
        <a class="nav-item" href="editor.html">編輯工作台</a>
        <a class="nav-item" href="templates.html">章節範本</a>
        <a class="nav-item" href="review.html">審閱佇列</a>
        <a class="nav-item active" href="tracking.html">計劃追蹤</a>
        <a class="nav-item" href="admin.html">管理中心</a>
        <a class="nav-item" href="agents.html">Agent 管理</a>
        <a class="nav-item" href="settings.html">偏好設定</a>
      </nav>
      <div class="rail-foot">
        <div class="avatar">S</div>
        <div>
          <div style="font-weight:600;color:var(--fg);font-size:12.5px">Scott</div>
          <div>管理員</div>
        </div>
        <button type="button" class="btn btn-sm btn-ghost" id="btn-logout" style="margin-left:auto">登出</button>
      </div>
    </aside>
    <main class="main" style="overflow:hidden;display:flex;flex-direction:column">
      <div class="toolbar">
        <div>
          <h1>計劃追蹤 · SCVB Tracking</h1>
          <div class="sub">讀取 plans/*.md · checkbox 進度 · PRD 結構 gate</div>
        </div>
        <div class="spacer"></div>
        <button type="button" class="btn" id="btn-refresh">重新整理</button>
        <a class="btn btn-ghost" href="editor.html">回編輯器</a>
      </div>
      <div class="content" style="padding:0;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column">
        <div class="tui-shell" style="flex:1">
          <div class="tui-rail">
            <div class="tui-panel-hd">plans/</div>
            <div id="plan-list"></div>
          </div>
          <div class="tui-main">
            <div class="tui-panel-hd" id="plan-hd">步驟</div>
            <div style="padding:12px 12px 0" id="plan-summary"></div>
            <div id="step-list"></div>
          </div>
          <div class="tui-side">
            <div class="tui-panel-hd">PRD 結構 gate</div>
            <div id="gate-panel" class="gate-list"></div>
            <div class="tui-panel-hd">L1–L6</div>
            <div id="layer-panel" style="padding:10px 12px"></div>
          </div>
          <div class="tui-footer" id="tui-footer">j/k 切計劃 · r 重新整理 · ? 說明</div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/src/pages/tracking.ts"></script>
</body>
</html>
