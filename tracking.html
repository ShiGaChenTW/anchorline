<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Task Tracking · Anchorline</title>
<link rel="stylesheet" href="shared.css" />
<style>
  /* 三欄：計劃清單｜這一份的內容｜結構檢查。
     刻意不用 mono 當全頁字體 —— mono 是給路徑、雜湊、程式碼的，
     整頁套上只是在扮演「技術感」，代價是所有字都同一個重量、掃不動。 */
  .tk-shell {
    display: grid;
    grid-template-columns: 268px minmax(0, 1fr) 300px;
    min-height: 0;
    height: 100%;
  }
  @media (max-width: 1080px) {
    .tk-shell { grid-template-columns: 240px minmax(0, 1fr); }
    .tk-side { display: none; }
  }
  @media (max-width: 820px) {
    .tk-shell { grid-template-columns: 1fr; }
    .tk-rail { max-height: 34vh; }
  }
  .tk-rail, .tk-main, .tk-side { overflow: auto; min-height: 0; }
  .tk-rail { border-right: 1px solid var(--border); background: var(--surface); }
  .tk-main { background: var(--bg); }
  .tk-side { border-left: 1px solid var(--border); background: var(--surface); }

  .tk-hd {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    background: inherit;
    font-size: var(--fs-2);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .tk-hd .mono { font-family: var(--mono); font-weight: 400; font-size: var(--fs-1); }

  /* ── 計劃清單：分組，未完成的組預設展開 ── */
  .tk-group { border-bottom: 1px solid var(--border-muted); }
  .tk-group > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    font-size: var(--fs-2);
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
  }
  .tk-group > summary::-webkit-details-marker { display: none; }
  .tk-group > summary:hover { color: var(--fg-2); }
  .tk-count {
    margin-left: auto;
    padding: 0 6px;
    border-radius: 4px;
    background: var(--inset);
    font-size: var(--fs-1);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .tk-rows { padding: 0 6px 8px; display: flex; flex-direction: column; gap: 1px; }
  .tk-row {
    display: block;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    border-radius: 7px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 160ms ease;
  }
  .tk-row:hover { background: var(--inset); }
  .tk-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tk-row.on { background: color-mix(in oklab, var(--accent) 15%, transparent); }
  .tk-row-t {
    display: block;
    font-size: var(--fs-3);
    font-weight: 500;
    line-height: 1.45;
    color: var(--fg-2);
  }
  .tk-row.on .tk-row-t { color: var(--fg); font-weight: 600; }
  /* agent 正在寫的那一份：左緣一條線比一個 6px 圓點好認 */
  .tk-row.tracked { box-shadow: inset 2px 0 0 var(--accent); }
  .tk-row-m { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
  .tk-mini {
    flex: 1 1 auto;
    height: 3px;
    border-radius: 99px;
    background: var(--inset);
    overflow: hidden;
  }
  .tk-mini > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .tk-num {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: var(--fs-1);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .tk-num--none { font-family: inherit; }

  /* ── 中欄 ── */
  .tk-body { padding: 22px 26px 40px; }
  .tk-title {
    margin: 0 0 16px;
    font-size: var(--fs-7);
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.3;
    color: var(--fg);
    max-width: 34ch;
  }

  /* 「現在該做什麼」—— 這一頁唯一該先被讀到的東西 */
  .tk-do {
    padding: 14px 16px;
    border: 1px solid color-mix(in oklab, var(--accent) 34%, var(--border));
    border-radius: 10px;
    background: color-mix(in oklab, var(--accent) 9%, transparent);
    margin-bottom: 18px;
  }
  .tk-do-k {
    margin: 0 0 6px;
    font-size: var(--fs-1);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--accent);
  }
  .tk-do-what {
    margin: 0;
    font-size: var(--fs-5);
    font-weight: 600;
    line-height: 1.5;
    color: var(--fg);
    max-width: 52ch;
  }
  .tk-do-clear { color: var(--success); }
  .tk-do-why {
    margin: 6px 0 0;
    font-size: var(--fs-3);
    line-height: 1.6;
    color: var(--muted);
    max-width: 60ch;
  }
  .tk-do-why code, .tk-empty code {
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--inset);
    font-family: var(--mono);
    font-size: var(--fs-2);
  }

  .tk-prog { margin-bottom: 22px; }
  .tk-bar { height: 6px; border-radius: 99px; background: var(--inset); overflow: hidden; }
  .tk-bar > i {
    display: block;
    height: 100%;
    border-radius: 99px;
    background: var(--accent);
    transition: width 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .tk-prog-m { margin: 7px 0 0; font-size: var(--fs-2); color: var(--muted); }
  .tk-prog-m strong { color: var(--fg); font-variant-numeric: tabular-nums; }

  /* ── 送出給 agent ──
     位置在進度條下方：它是「測完之後要做的下一件事」，順序就是閱讀順序。
     族系選單預設收著 —— 四顆按鈕常駐會跟結果鈕搶同一種視覺重量，
     而這是一次性的動作，不是每一題都要看到的東西。 */
  /* 同一份報告收在同一個框（2026-08-14 principal 指示）：框掛在 .tk-body，
     摘要、送出、每一題都是框內段落，題目之間用分隔線，不再一題一張浮卡。 */
  .tk-body.tk-uat-frame {
    margin: 18px 22px 36px;
    padding: 18px 20px 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }
  .tk-uat-frame .tk-uat {
    border: 0;
    border-top: 1px solid var(--border-muted);
    border-radius: 0;
    background: none;
    margin: 0;
    padding: 16px 0;
  }
  .tk-uat-send { margin: -10px 0 20px; }
  .tk-uat-send-row { display: flex; flex-wrap: wrap; gap: 8px; }
  /* 檔頭脈絡：測試前必讀的重要資訊（目的/環境/免測/編號） */
  .tk-uat-pre { margin: -6px 0 18px; font-size: var(--fs-3); color: var(--fg-2); }
  .tk-uat-pre blockquote {
    margin: 0 0 8px;
    padding: 10px 14px;
    border-left: 3px solid var(--border);
    background: var(--inset);
    border-radius: 0 8px 8px 0;
  }
  .tk-uat-pre p { margin: 4px 0; line-height: 1.65; }
  .tk-uat-pre strong { color: var(--fg-1); font-weight: 600; }
  .tk-uat-pre ul,
  .tk-uat-pre ol { margin: 6px 0; padding-left: 1.5em; line-height: 1.65; }
  .tk-uat-pre li { margin: 2px 0; }
  .tk-uat-pre code {
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--surface);
    font-family: var(--mono);
    font-size: var(--fs-2);
  }
  .tk-diff-modal { width: min(640px, 100%); }
  .tk-diff-body { max-height: 60vh; overflow: auto; }
  .tk-diff-row { padding: 10px 0; border-bottom: 1px solid var(--border-muted); }
  .tk-diff-hd { display: flex; align-items: baseline; gap: 10px; }
  .tk-diff-t { flex: 1 1 auto; font-weight: 600; font-size: var(--fs-3); }
  .tk-diff-v { font-size: var(--fs-2); color: var(--muted); }
  .tk-diff-v b { font-weight: 600; }
  .tk-diff-note {
    margin: 6px 0 0;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--inset);
    font-family: inherit;
    font-size: var(--fs-2);
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .tk-diff-sum { margin: 10px 0 0; font-size: var(--fs-2); color: var(--muted); }
  .tk-uat-send-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    color: var(--fg-2);
    font: inherit;
    font-size: var(--fs-2);
    font-weight: 500;
    cursor: pointer;
  }
  .tk-uat-send-btn:hover:not([disabled]) { background: var(--inset); }
  .tk-uat-send-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tk-uat-send-btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .tk-uat-fams { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tk-uat-fams[hidden] { display: none; }
  .tk-uat-send-note {
    margin: 8px 0 0;
    font-size: var(--fs-2);
    line-height: 1.6;
    color: var(--meta);
    max-width: 60ch;
  }

  /* 步驟：未完成排前面，完成的降低對比但不刪除 */
  .tk-step {
    display: grid;
    /* 第三欄是列尾的動作（交接）。用 auto 而不是固定寬：沒有動作的步驟
       （已完成、沒有錨點）那一欄會收成 0，不會在右邊留一條空白帶。 */
    grid-template-columns: 16px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: start;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-muted);
  }
  .tk-step-mark {
    margin-top: 4px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 1.5px solid var(--meta);
  }
  .tk-step.pending .tk-step-mark { border-color: var(--accent); }
  .tk-step.done .tk-step-mark { border-color: var(--success); background: var(--success); }
  .tk-step.skipped .tk-step-mark { border-style: dashed; }
  .tk-step-t { font-size: var(--fs-4); line-height: 1.6; color: var(--fg-2); max-width: 74ch; }
  .tk-step.done .tk-step-t { color: var(--muted); }
  .tk-step.skipped .tk-step-t { color: var(--meta); text-decoration: line-through; }

  /* ── 實測報告：一題一張卡 ──
     為什麼不沿用 .tk-step：那一條是「一行一件事」的密集清單，適合掃過去。
     實測要的是相反的東西 —— 使用者手上正在照著流程操作，眼睛會離開螢幕再回來，
     所以一題要有邊界、找得回來。卡片是那個邊界。 */
  .tk-uat {
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    margin-bottom: 10px;
  }
  /* 已結的題降低對比但不收合：使用者常常要回頭確認自己剛剛選了什麼 */
  .tk-uat.closed { background: none; border-color: var(--border-muted); }
  .tk-uat-hd { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .tk-uat-t {
    margin: 0;
    flex: 1 1 auto;
    font-size: var(--fs-5);
    font-weight: 600;
    line-height: 1.5;
    color: var(--fg);
    max-width: 60ch;
  }
  .tk-uat.closed .tk-uat-t { color: var(--fg-2); }
  .tk-uat-tag {
    flex: 0 0 auto;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid var(--border);
    font-size: var(--fs-1);
    font-weight: 600;
    color: var(--muted);
  }
  .tk-uat-k {
    margin: 0 0 4px;
    font-size: var(--fs-1);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .tk-uat-k em { font-style: normal; font-weight: 400; color: var(--meta); }
  .tk-uat-steps {
    margin: 0 0 12px;
    padding-left: 20px;
    font-size: var(--fs-3);
    line-height: 1.7;
    color: var(--fg-2);
    max-width: 70ch;
  }
  .tk-uat-steps li { margin: 0 0 2px; }
  .tk-uat-exp {
    /* 預期可能是多行，parser 原樣保留換行 —— 折成一段會把「三個條件」讀成一句話 */
    white-space: pre-wrap;
    margin: 0 0 12px;
    font-size: var(--fs-3);
    line-height: 1.7;
    color: var(--fg-2);
    max-width: 70ch;
  }

  /* 四顆結果鈕。色調只用既有 token —— 不新增主題層 */
  .tk-uat-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tk-vb {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    color: var(--fg-2);
    font: inherit;
    font-size: var(--fs-2);
    font-weight: 500;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease;
  }
  .tk-vb:hover:not([disabled]) { background: var(--inset); }
  .tk-vb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tk-vb[disabled] { opacity: 0.45; cursor: not-allowed; }
  /* 選中態靠「填色 + 粗體」表達，不是只換邊框顏色 ——
     四顆並排時，只有邊框變色在小尺寸下看不出來哪一顆被選了 */
  .tk-vb.on { font-weight: 650; }
  .tk-vb--pass.on {
    border-color: var(--success);
    background: var(--success-bg);
    color: var(--success);
  }
  .tk-vb--fail.on {
    border-color: var(--danger);
    background: var(--danger-bg);
    color: var(--danger);
  }
  .tk-vb--wont.on { border-color: var(--meta); background: var(--inset); color: var(--muted); }
  .tk-vb--later.on {
    border-color: var(--warn);
    background: var(--warn-bg);
    color: var(--warn);
  }
  /* 標籤與按鈕同一套色，才看得出「上面那顆」跟「右上角那個字」是同一件事 */
  .tk-uat-tag.tk-v--pass { border-color: var(--success); color: var(--success); }
  .tk-uat-tag.tk-v--fail { border-color: var(--danger); color: var(--danger); }
  .tk-uat-tag.tk-v--later { border-color: var(--warn); color: var(--warn); }
  .tk-uat-tag.tk-v--wont { border-color: var(--meta); color: var(--meta); }

  .tk-uat-note { display: block; }
  .tk-uat-note textarea {
    width: 100%;
    min-height: 52px;
    resize: vertical;
    font-size: var(--fs-3);
    line-height: 1.6;
  }
  /* 擋存原因：預設不佔位置，被擋時才出現在那一題底下 */
  .tk-uat-err { display: none; margin: 8px 0 0; font-size: var(--fs-2); color: var(--danger); }
  .tk-uat-err.on { display: block; }
  .tk-uat-warn {
    margin: 10px 0 0;
    padding: 8px 11px;
    border: 1px solid color-mix(in oklab, var(--warn) 40%, var(--border));
    border-radius: 7px;
    background: var(--warn-bg);
    font-size: var(--fs-2);
    line-height: 1.6;
    color: var(--fg-2);
  }
  .tk-uat-warn code {
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--inset);
    font-family: var(--mono);
    font-size: var(--fs-1);
  }
  @media (prefers-reduced-motion: reduce) {
    .tk-vb { transition: none; }
  }

  /* 空狀態要教怎麼做，不是只說「沒有」 */
  .tk-empty { padding: 18px 4px; max-width: 56ch; }
  .tk-empty p { margin: 0 0 8px; font-size: var(--fs-3); line-height: 1.65; color: var(--fg-2); }
  .tk-empty-how { color: var(--muted) !important; font-size: var(--fs-3) !important; }
  .tk-code {
    margin: 6px 0 0;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--inset);
    overflow-x: auto;
  }
  .tk-code code { font-family: var(--mono); font-size: var(--fs-2); line-height: 1.7; color: var(--fg-2); }

  /* ── 右欄：結構檢查 ── */
  .tk-side-body { padding: 12px 14px 24px; }
  .tk-gate {
    padding: 12px 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 8px;
  }
  .tk-gate--block { border-color: color-mix(in oklab, var(--danger, #f85149) 45%, var(--border)); }
  .tk-gate--warn { border-color: color-mix(in oklab, var(--warn) 40%, var(--border)); }
  .tk-gate-lv { margin: 0 0 5px; font-size: var(--fs-1); font-weight: 700; letter-spacing: 0.04em; }
  .tk-gate--block .tk-gate-lv { color: var(--danger, #f85149); }
  .tk-gate--warn .tk-gate-lv { color: var(--warn); }
  .tk-gate-t { margin: 0 0 4px; font-size: var(--fs-3); font-weight: 600; line-height: 1.45; color: var(--fg); }
  .tk-gate-d { margin: 0; font-size: var(--fs-2); line-height: 1.6; color: var(--muted); }
  .tk-gate-rest > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    font-size: var(--fs-2);
    color: var(--muted);
    cursor: pointer;
    list-style: none;
  }
  .tk-gate-rest > summary::-webkit-details-marker { display: none; }
  .tk-gate-rest > summary:hover { color: var(--fg-2); }
  .tk-gate-ok { padding: 12px 4px; font-size: var(--fs-3); color: var(--success); }

  .tk-layers { display: flex; flex-direction: column; gap: 1px; margin: 18px 0 0; }
  .tk-layer {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: var(--fs-2);
    color: var(--meta);
  }
  .tk-layer-c { font-family: var(--mono); font-size: var(--fs-1); }
  .tk-layer.done { color: var(--fg-2); }
  .tk-layer.done .tk-layer-c { color: var(--success); }
  .tk-layer.active {
    background: color-mix(in oklab, var(--accent) 13%, transparent);
    color: var(--fg);
    font-weight: 600;
  }
  .tk-layer.active .tk-layer-c { color: var(--accent); }

  .tk-facts { margin: 18px 0 0; display: grid; gap: 10px; }
  .tk-facts dt { font-size: var(--fs-1); letter-spacing: 0.04em; color: var(--muted); }
  .tk-facts dd { margin: 3px 0 0; font-size: var(--fs-3); line-height: 1.55; color: var(--fg-2); }

  /* ── 底部狀態列 ── */
  .tk-footer {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: var(--fs-2);
    color: var(--muted);
  }
  .tk-foot-sp { flex: 1 1 auto; }
  .tk-keys { display: flex; align-items: center; gap: 4px; }
  .tk-keys kbd {
    padding: 1px 5px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    font-family: var(--mono);
    font-size: var(--fs-1);
    color: var(--fg-2);
  }
  .tk-foot-live { color: var(--fg-2); }
  @media (prefers-reduced-motion: reduce) {
    .tk-row, .tk-bar > i { transition: none; }
  }
</style>
<script>(function(){try{var t=localStorage.getItem("anchorline:theme")||localStorage.getItem("specforge:theme");if(t==="warp")t="terminal";if(t==="claude")t="kami";var m={kami:["light","#f5f4ed"],github:["dark","#0d1117"],terminal:["dark","#0d0b08"]};if(!m[t])t="github";var r=document.documentElement;r.setAttribute("data-theme",t);r.style.colorScheme=m[t][0];r.style.background=m[t][1];}catch(e){document.documentElement.setAttribute("data-theme","github");}})();</script>
</head>
<body>
<div class="app">
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand">
        <div class="rail-logo">AL</div>
        <div class="rail-brand-text">
          <strong>Anchorline</strong>
          <span>anchorline.local</span>
        </div>
      </div>
      <div class="rail-theme-row">
        <div class="theme-switch rail-theme-switch" data-theme-switch data-od-id="theme-switch" role="group" aria-label="設計主題">
