<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工作台-OpenSpec · Anchorline</title>
<link rel="stylesheet" href="shared.css" />
<style>
  /* 這一頁的專屬樣式。三欄骨架直接沿用 shared.css 的 .wb / .wb-col ——
     跟工作台-PRD 同一套，換頁時欄寬與邊框不會跳。
     願望清單（.os-wish-*）、原始檔檢視（.fv-*）
     也全部沿用既有 class，不另做一套外觀。 */

  /* 左欄要塞三塊（change 選單／檔案／願望），整欄自己捲 */
  .osw-left { overflow: auto; }

  /* ── change 選單 ── */
  .osw-changes { padding: 6px; display: flex; flex-direction: column; gap: 1px; }
  .osw-change {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 9px;
    border: 0;
    border-radius: 7px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 160ms ease;
  }
  .osw-change:hover { background: var(--inset); }
  .osw-change:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .osw-change.on { background: color-mix(in oklab, var(--accent) 15%, transparent); }
  .osw-change-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: var(--fs-3);
    color: var(--fg-2);
  }
  .osw-change.on .osw-change-name { color: var(--fg); font-weight: 600; }
  .osw-change-n {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: var(--fs-1);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  /* 「已完成 N 個」那一列是可以按的 —— 沿用 .os-group 的排版，
     只把 button 自帶的外觀清掉，這樣它跟上面兩個分類標題對齊。 */
  button.os-group--done {
    width: 100%;
    border: 0;
    background: none;
    font: inherit;
    color: var(--muted);
    text-align: left;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  button.os-group--done:hover { background: var(--inset); }
  button.os-group--done:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ── 右欄：進度 / 健康狀態 ── */
  .osw-side-body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 10px 12px; }
  .osw-card {
    margin: 0 0 12px;
    padding: 10px 11px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }
  .osw-card > h3 {
    margin: 0 0 8px;
    font-size: var(--fs-1);
    font-family: var(--font-body);
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    font-weight: 400;
  }
  .osw-bar {
    height: 5px;
    border-radius: 99px;
    background: var(--inset);
    overflow: hidden;
    margin: 6px 0;
  }
  .osw-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .osw-num {
    font-family: var(--mono);
    font-size: var(--fs-2);
    font-variant-numeric: tabular-nums;
    color: var(--fg-2);
  }
  .osw-note { margin: 6px 0 0; font-size: var(--fs-2); color: var(--muted); line-height: 1.5; }
  .osw-art { display: flex; align-items: center; gap: 7px; padding: 4px 0; font-size: var(--fs-2); }
  .osw-art-name { flex: 1 1 auto; min-width: 0; color: var(--fg-2); }
  .osw-dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .osw-dot.done { background: #3fb950; }
  .osw-dot.ready { background: var(--accent); }
  .osw-dot.blocked { background: #f85149; }
  .osw-dot.skipped { background: var(--border); }
  .osw-tag {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: var(--fs-1);
    color: var(--muted);
  }

  .osw-tabs {
    display: flex;
    gap: 2px;
    padding: 8px 12px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex: 0 0 auto;
  }
  .osw-tab {
    border: 1px solid transparent;
    border-bottom: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: var(--fs-2);
    font-weight: 600;
    padding: 8px 12px 9px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
  }
  .osw-tab:hover { color: var(--fg); }
  .osw-tab[aria-selected="true"] {
    background: var(--bg);
    color: var(--fg);
    border-color: var(--border);
  }
  .osw-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .osw-tab-n {
    display: inline-block;
    margin-left: 8px;
    font-family: var(--mono);
    font-size: var(--fs-1);
    font-weight: 500;
    background: var(--inset);
    color: var(--muted);
    padding: 1px 6px;
    border-radius: 99px;
    vertical-align: 1px;
  }
  .osw-tab[aria-selected="true"] .osw-tab-n {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .osw-tab.is-warn .osw-tab-n {
    background: var(--warn-bg);
    color: var(--warn);
  }

  .osw-now {
    margin: 8px 8px 10px;
    padding: 10px 11px;
    border-radius: 10px;
    border: 1px solid color-mix(in oklab, var(--accent) 40%, var(--border));
    background: color-mix(in oklab, var(--accent) 10%, var(--bg));
  }
  .osw-now-k {
    margin: 0 0 4px;
    font-size: var(--fs-1);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .osw-now-t { margin: 0 0 4px; font-size: var(--fs-3); font-weight: 600; }
  .osw-now-w { margin: 0 0 8px; font-size: var(--fs-2); color: var(--muted); line-height: 1.45; }
  .osw-now-act, .osw-q-act { display: flex; flex-wrap: wrap; gap: 6px; }

  .osw-q {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 8px;
    width: calc(100% - 12px);
    margin: 0 6px 4px;
    padding: 8px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .osw-q:hover { background: var(--inset); }
  .osw-q.on {
    background: color-mix(in oklab, var(--accent) 15%, transparent);
    border-color: color-mix(in oklab, var(--accent) 30%, transparent);
  }
  .osw-q:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .osw-q-name { font-size: var(--fs-3); color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .osw-q.on .osw-q-name { color: var(--fg); font-weight: 600; }
  .osw-q-n {
    font-family: var(--mono);
    font-size: var(--fs-1);
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .osw-q-why { grid-column: 1 / -1; font-size: var(--fs-1); color: var(--muted); line-height: 1.4; }
  .osw-q-act { grid-column: 1 / -1; margin-top: 4px; }
  .osw-files {
    grid-column: 1 / -1;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid color-mix(in oklab, var(--accent) 20%, var(--border));
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .osw-file {
    display: grid;
    grid-template-columns: 8px 1fr auto;
    gap: 8px;
    align-items: center;
    width: 100%;
    padding: 4px 2px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: inherit;
    font: inherit;
    font-size: var(--fs-2);
    text-align: left;
    cursor: pointer;
  }
  .osw-file:hover { background: var(--inset); }
  .osw-file.next .osw-file-name { color: var(--accent); font-weight: 600; }
  .osw-stall {
    flex: 0 0 auto;
    margin: 10px 12px 0;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--warn-bg);
    border: 1px solid color-mix(in oklab, var(--warn) 35%, var(--border));
  }
  .osw-stall-k {
    margin: 0 0 4px;
    font-size: var(--fs-1);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--warn);
  }
  .osw-stall p { margin: 0 0 8px; font-size: var(--fs-2); line-height: 1.45; color: var(--fg); }
  .osw-stall p:last-child { margin-bottom: 0; }
  .osw-spec-note {
    margin: 8px 12px 10px;
    font-size: var(--fs-2);
    color: var(--muted);
    line-height: 1.45;
  }
  #osw-panel-wishlist,
  #osw-panel-changes,
  #osw-panel-specs {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }
  #osw-panel-changes .osw-changes,
  #osw-panel-specs .osw-changes { flex: 1 1 auto; }
  .wb[data-osw-stage="wishlist"] .os-wish {
    flex: 1 1 auto;
    border-bottom: 0;
    overflow: auto;
  }

  .wb[data-osw-stage="wishlist"] .osw-stall,
  .wb[data-osw-stage="wishlist"] #osw-panel-changes,
  .wb[data-osw-stage="wishlist"] #osw-panel-specs,
  .wb[data-osw-stage="changes"] #osw-panel-wishlist,
  .wb[data-osw-stage="changes"] #osw-panel-specs,
  .wb[data-osw-stage="specs"] #osw-panel-wishlist,
  .wb[data-osw-stage="specs"] #osw-panel-changes { display: none; }

  .wb[data-osw-stage="specs"] .osw-stall {
    background: var(--accent-soft);
    border-color: color-mix(in oklab, var(--accent) 35%, var(--border));
  }
  .wb[data-osw-stage="specs"] .osw-stall-k { color: var(--accent); }
</style>
<script>(function(){try{var t=localStorage.getItem("anchorline:theme")||localStorage.getItem("specforge:theme");if(t==="warp")t="terminal";if(t==="claude")t="kami";var m={kami:["light","#f5f4ed"],github:["dark","#0d1117"],terminal:["dark","#0d0b08"]};if(!m[t])t="github";var r=document.documentElement;r.setAttribute("data-theme",t);r.style.colorScheme=m[t][0];r.style.background=m[t][1];}catch(e){document.documentElement.setAttribute("data-theme","github");}})();</script>
</head>
<body aria-busy="true">
<!-- 開場遮罩。**寫死在這裡**，因為用 JS 建的最快也要等 module 下載、解析、
     執行完才出現 —— 而要蓋住的正好是那段時間（殼畫好了、內容區還空著）。
     接手與收掉都在 src/lib/loading-overlay.ts：beginBootOverlay / endBootOverlay。 -->
<div id="app-loading-overlay" class="load-back" role="status" aria-live="polite">
  <div class="load-box">
    <p class="load-text">載入中</p>
    <span class="load-bar" role="progressbar" aria-label="讀取中"><i></i></span>
    <p class="load-stall">比預期久了一點。如果畫面一直停在這裡，重新整理這一頁。</p>
  </div>
</div>
<div class="app" data-od-id="app-openspec-workspace">
  <div class="shell">
    <aside class="rail" data-od-id="rail">
      <div class="rail-brand">
        <div class="rail-logo">AL</div>
        <div class="rail-brand-text">
          <strong>Anchorline</strong>
          <span>anchorline.local</span>
        </div>
      </div>
      <div class="rail-theme-row">
        <div class="theme-switch rail-theme-switch" data-theme-switch data-od-id="theme-switch" role="group" aria-label="設計主題">
          <button type="button" data-theme-value="kami" aria-pressed="false">LIGHT</button>
          <button type="button" data-theme-value="github" aria-pressed="true">DARK</button>
          <button type="button" data-theme-value="terminal" aria-pressed="false">TERMINAL</button>
        </div>
      </div>
      <nav class="rail-nav">
        <div class="nav-label">工作區</div>
        <a class="nav-item" href="editor.html" data-od-id="nav-editor">工作台-PRD</a>
        <a class="nav-item active" href="openspec-workspace.html" data-od-id="nav-openspec-workspace">工作台-OpenSpec</a>
        <a class="nav-item" href="tracking.html" data-od-id="nav-tracking">Task Tracking</a>
        <a class="nav-item" href="settings.html" data-od-id="nav-settings">偏好設定</a>
      </nav>
      <div class="rail-foot rail-foot--user" aria-label="目前使用者">
        <div class="rail-user">
          <div class="avatar" data-user-avatar aria-hidden="true">S</div>
          <div class="rail-user-body">
            <div class="rail-user-top">
              <div class="rail-foot-meta" data-user-meta>
                <div class="rail-foot-name">—</div>
                <div class="rail-foot-title">—</div>
              </div>
              <button type="button" class="btn btn-sm btn-ghost btn-logout" data-logout title="登出">登出</button>
            </div>
            <div class="rail-user-role-row">
              <span class="role-badge role-tone-editor" data-user-role-badge>—</span>
              <span class="rail-user-kind" data-user-kind>人員</span>
            </div>
            <div class="rail-user-perms" data-user-perms role="list" aria-label="權限摘要">
              <span class="perm-chip" role="listitem">—</span>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main" data-od-id="main-openspec-workspace">
      <div class="toolbar context-toolbar context-surface-toolbar" data-context="openspec-workspace" data-od-id="toolbar">
        <div class="context-frame-top">
          <span class="context-kicker">07 / OPENSPEC</span>
          <span class="context-state">SPECIFYING</span>
        </div>
        <div class="context-title-block">
          <h1 data-od-id="page-title">未選擇專案</h1>
          <div class="sub" data-od-id="page-sub">選擇專案後開始</div>
        </div>
        <div class="context-frame-bottom">
          <span class="context-path">project / openspec</span>
          <div class="context-actions">
            <button type="button" class="btn btn-ghost btn-sm" id="btn-osw-refresh"
                    title="重新掃描 openspec/ 與任務進度">重新整理</button>
            <a class="btn btn-ghost btn-sm" href="openspec.html" id="btn-osw-new">開新 change</a>
            <a class="btn btn-ghost" href="editor.html">回工作台-PRD</a>
          </div>
        </div>
      </div>
      <p id="perm-banner" hidden class="sub" style="margin:0;padding:8px 16px;background:var(--warn-bg);color:var(--fg);border-bottom:1px solid var(--border);font-size: var(--fs-3)"></p>

      <div class="content" style="overflow:hidden;display:flex;flex-direction:column">
        <div class="osw-tabs" role="tablist" aria-label="OpenSpec 工作台">
          <button type="button" class="osw-tab" role="tab" id="osw-tab-wishlist"
                  data-osw-tab="wishlist" aria-selected="false" aria-controls="osw-panel-wishlist">
            Wishlist<span class="osw-tab-n" id="osw-tab-wish-n">0</span>
          </button>
          <button type="button" class="osw-tab" role="tab" id="osw-tab-changes"
                  data-osw-tab="changes" aria-selected="true" aria-controls="osw-panel-changes">
            Changes<span class="osw-tab-n" id="osw-change-count">—</span>
          </button>
          <button type="button" class="osw-tab" role="tab" id="osw-tab-specs"
                  data-osw-tab="specs" aria-selected="false" aria-controls="osw-panel-specs">
            Specs<span class="osw-tab-n" id="osw-spec-count">—</span>
          </button>
        </div>
        <div class="wb" data-od-id="workbench" data-osw-stage="changes">
          <!-- 左欄三個分頁共用這一格，避免第五個 grid item 把 resize-panels 擠塌。 -->
          <div class="wb-col osw-left" data-od-id="osw-left-col">
            <div id="osw-panel-wishlist" role="tabpanel" aria-labelledby="osw-tab-wishlist">
              <div class="wb-head">
                <h2>Function Wish List</h2>
                <button type="button" class="ft-collapse" id="btn-wish-toggle"
                        aria-expanded="true" aria-controls="os-wish" title="收合願望清單">
                  <span aria-hidden="true">‹</span>
                </button>
              </div>
              <div id="os-wish" class="os-wish" hidden></div>
            </div>

            <div id="osw-panel-changes" role="tabpanel" aria-labelledby="osw-tab-changes">
              <div class="wb-head">
                <h2>Changes</h2>
                <button type="button" class="btn btn-sm btn-ghost" id="osw-rename"
                        title="更改目前這個 change 的資料夾名稱">改名</button>
              </div>
              <div class="osw-changes" id="osw-changes" role="listbox" aria-label="OpenSpec changes"></div>
            </div>

            <!-- Specs 是 change 走完 `openspec archive` 之後留下的現況規格。
                 Changes 只回答「還沒收完的提案有哪些」，看不到已經生效的承諾；
                 少了這一區，這一頁就沒有任何入口讀得到 openspec/specs/。 -->
            <div id="osw-panel-specs" role="tabpanel" aria-labelledby="osw-tab-specs">
              <div class="wb-head">
                <h2>Specs</h2>
              </div>
              <div class="osw-changes" id="osw-specs" role="listbox" aria-label="OpenSpec specs"></div>
            </div>
          </div>

          <!-- 中欄：原始檔案檢視／編輯 -->
          <div class="wb-col editor-pane" data-od-id="osw-file-col">
            <div class="wb-head">
              <h2 id="sec-label">選一個檔案</h2>
            </div>
            <div id="osw-stall" class="osw-stall" hidden></div>
            <div class="editor-body" id="editor-body" data-od-id="osw-file-body"></div>
          </div>

          <!-- 右欄：任務進度 / openspec status / change 健康狀態。
               class 與 data-od-id 沿用 coach —— `resize-panels.ts` 的
               `initWorkbenchResize()` 靠 `.coach` / `coach-col` 認出「右邊那一欄」，
               認不出來時它只會寫三軌的 grid-template-columns，第四個 grid item
               （也就是這一欄）會被擠到第二列。不報錯，只是版面塌掉。 -->
          <div class="wb-col coach" data-od-id="coach-col">
            <div class="wb-head">
              <h2>這個 Change</h2>
              <span class="pill pill-review" id="osw-health-pill">—</span>
            </div>
            <div class="coach-body osw-side-body" id="osw-side-body"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="/src/pages/openspec-workspace.ts"></script>
</body>
</html>
