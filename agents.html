<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent 管理 · SpecForge</title>
<link rel="stylesheet" href="shared.css" />
<style>
  .agents-layout {
    display: grid;
    grid-template-columns: minmax(220px, 280px) 1fr;
    min-height: 0;
    height: 100%;
  }
  .agent-list {
    border-right: 1px solid var(--border);
    background: var(--surface);
    overflow: auto;
    padding: 10px;
  }
  .agent-list h2 {
    margin: 4px 8px 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .agent-item {
    display: flex;
    gap: 10px;
    align-items: center;
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    color: var(--fg);
    border-radius: var(--radius-md);
    padding: 10px;
    cursor: pointer;
    font: inherit;
    margin-bottom: 4px;
  }
  .agent-item:hover { background: var(--inset); }
  .agent-item.active {
    border-color: color-mix(in oklab, var(--accent) 35%, var(--border));
    background: var(--accent-soft);
  }
  .agent-item .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--meta);
  }
  .agent-item .dot.on { background: var(--success); box-shadow: 0 0 0 3px color-mix(in oklab, var(--success) 25%, transparent); }
  .agent-item .dot.off { background: var(--danger); opacity: 0.7; }
  .agent-item strong { display: block; font-size: 13px; font-weight: var(--weight-em); }
  .agent-item span { font-size: 11px; color: var(--muted); }
  .agent-detail {
    overflow: auto;
    padding: 16px 18px 40px;
  }
  .agent-detail h1 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: var(--weight-em);
  }
  .agent-detail .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .agent-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 900px) {
    .agents-layout { grid-template-columns: 1fr; }
    .agent-list { max-height: 180px; border-right: 0; border-bottom: 1px solid var(--border); }
    .agent-grid { grid-template-columns: 1fr; }
  }
  .field-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .field-block label {
    display: block;
    font-size: 12px;
    font-weight: var(--weight-em);
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field-block textarea,
  .field-block input,
  .field-block select {
    width: 100%;
    box-sizing: border-box;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
  }
  .field-block textarea { min-height: 120px; resize: vertical; font-family: var(--mono); line-height: 1.45; }
  .field-block textarea.role { min-height: 90px; font-family: inherit; }
  .toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 16px; }
  .jobs { margin-top: 8px; }
  .job-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    margin-bottom: 8px;
    background: var(--bg);
    font-size: 12px;
  }
  .job-card .hd { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .invoke-box {
    border: 1px solid color-mix(in oklab, var(--accent) 30%, var(--border));
    background: var(--accent-soft);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .invoke-box h3 { margin: 0 0 8px; font-size: 14px; }
  .empty-agent { padding: 40px; text-align: center; color: var(--muted); }
</style>
<script>(function(){try{var t=localStorage.getItem("specforge:theme");if(t==="warp")t="github";if(t==="claude")t="kami";var m={kami:["light","#f5f4ed"],github:["dark","#0d1117"]};if(!m[t])t="github";var r=document.documentElement;r.setAttribute("data-theme",t);r.style.colorScheme=m[t][0];r.style.background=m[t][1];}catch(e){document.documentElement.setAttribute("data-theme","github");}})();</script>
</head>
<body>
<div class="app">
  <div class="shell">
    <aside class="rail">
            <div class="rail-brand">
        <div class="rail-logo">PR</div>
        <div class="rail-brand-text">
          <strong>PRD開發監控台</strong>
          <span>prd.local</span>
        </div>
      </div>
      <div class="rail-theme-row">
        <div class="theme-switch rail-theme-switch" data-theme-switch data-od-id="theme-switch" role="group" aria-label="設計主題">
          <button type="button" data-theme-value="kami" aria-pressed="false">LIGHT</button>
          <button type="button" data-theme-value="github" aria-pressed="true">DARK</button>
        </div>
      </div>

      <nav class="rail-nav">
        <div class="nav-label">工作區</div>
        <a class="nav-item" href="editor.html">編輯工作台</a>
        <a class="nav-item" href="templates.html">章節範本</a>
        <a class="nav-item" href="review.html">審閱佇列</a>
        <a class="nav-item" href="tracking.html" data-od-id="nav-tracking">
          計劃追蹤
        </a>

        <a class="nav-item" href="admin.html">管理中心</a>
        <a class="nav-item active" href="agents.html">Agent 管理</a>
        <a class="nav-item" href="settings.html">偏好設定</a>
      </nav>
      <div class="rail-foot rail-foot--user" aria-label="目前使用者">
        <div class="rail-user">
          <div class="avatar" data-user-avatar aria-hidden="true">S</div>
          <div class="rail-user-body">
            <div class="rail-user-top">
              <div class="rail-foot-meta" data-user-meta>
                <div class="rail-foot-name">—</div>
                <div class="rail-foot-title">—</div>
              </div>
              <button type="button" class="btn btn-sm btn-ghost btn-logout" data-logout title="登出">登出</button>
            </div>
            <div class="rail-user-role-row">
              <span class="role-badge role-tone-editor" data-user-role-badge>—</span>
              <span class="rail-user-kind" data-user-kind>人員</span>
            </div>
            <div class="rail-user-perms" data-user-perms role="list" aria-label="權限摘要">
              <span class="perm-chip" role="listitem">—</span>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <main class="main" style="overflow:hidden;display:flex;flex-direction:column">
      <div class="toolbar">
        <div>
          <h1>Agent 人員管理</h1>
          <div class="sub">編輯 prompt／role · 啟動／關閉 · 呼叫進場作業</div>
        </div>
        <div class="spacer"></div>
      </div>
      <div class="content" style="padding:0;overflow:hidden;flex:1;min-height:0">
        <div class="agents-layout">
          <aside class="agent-list" id="agent-list">
            <h2>Agents</h2>
          </aside>
          <section class="agent-detail" id="agent-detail">
            <div class="empty-agent">選擇左側 Agent 開始編輯</div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="/src/pages/agents.ts"></script>
</body>
</html>
