<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>章節範本庫 · Anchorline</title>
<link rel="stylesheet" href="shared.css" />
<script>(function(){try{var t=localStorage.getItem("anchorline:theme")||localStorage.getItem("specforge:theme");if(t==="warp")t="terminal";if(t==="claude")t="kami";var m={kami:["light","#f5f4ed"],github:["dark","#0d1117"],terminal:["dark","#0d0b08"]};if(!m[t])t="github";var r=document.documentElement;r.setAttribute("data-theme",t);r.style.colorScheme=m[t][0];r.style.background=m[t][1];}catch(e){document.documentElement.setAttribute("data-theme","github");}})();</script>
</head>
<body>
<div class="app" data-od-id="app-templates">
  <div class="shell">
    <aside class="rail" data-od-id="rail">
            <div class="rail-brand">
        <div class="rail-logo">AL</div>
        <div class="rail-brand-text">
          <strong>Anchorline</strong>
          <span>anchorline.local</span>
        </div>
      </div>
      <div class="rail-theme-row">
        <div class="theme-switch rail-theme-switch" data-theme-switch data-od-id="theme-switch" role="group" aria-label="設計主題">
          <button type="button" data-theme-value="kami" aria-pressed="false">LIGHT</button>
          <button type="button" data-theme-value="github" aria-pressed="true">DARK</button>
          <button type="button" data-theme-value="terminal" aria-pressed="false">TERMINAL</button>
        </div>
      </div>

      <nav class="rail-nav">
        <div class="nav-label">工作區</div>
        <a class="nav-item" href="editor.html" data-od-id="nav-editor">
          <svg class="ic" viewBox="0 0 16 16" fill="currentColor"><path d="M11.013 1.427a1.75 1.75 0 0 1 2.474 0l1.086 1.086a1.75 1.75 0 0 1 0 2.474l-8.61 8.61c-.21.21-.47.364-.756.445l-3.251.93a.75.75 0 0 1-.927-.928l.929-3.25c.081-.286.235-.547.445-.758l8.61-8.61zm1.414 1.06a.25.25 0 0 0-.354 0L10.811 3.75l1.439 1.44 1.263-1.263a.25.25 0 0 0 0-.354l-1.086-1.086zM11.189 6.25 9.75 4.81l-6.286 6.287a.25.25 0 0 0-.064.108l-.558 1.953 1.953-.558a.25.25 0 0 0 .108-.064l6.286-6.286z"/></svg>
          編輯工作台
        </a>
        <a class="nav-item active" href="templates.html" data-od-id="nav-templates">
          <svg class="ic" viewBox="0 0 16 16" fill="currentColor"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v3.5A1.75 1.75 0 0 1 14.25 7H1.75A1.75 1.75 0 0 1 0 5.25v-3.5zM1.75 1a.25.25 0 0 0-.25.25v3.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-3.5a.25.25 0 0 0-.25-.25H1.75zM0 10.75C0 9.784.784 9 1.75 9h12.5c.966 0 1.75.784 1.75 1.75v3.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25v-3.5zm1.75-.75a.25.25 0 0 0-.25.25v3.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-3.5a.25.25 0 0 0-.25-.25H1.75z"/></svg>
          章節範本
          <span class="count">12</span>
        </a>
        <a class="nav-item" href="review.html" data-od-id="nav-review">
          <svg class="ic" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 8a6.5 6.5 0 1 1 13 0 6.5 6.5 0 0 1-13 0zM8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm.75 4.75a.75.75 0 0 0-1.5 0v3.5a.75.75 0 0 0 .471.696l2.5 1a.75.75 0 0 0 .557-1.392l-2.028-.811V4.75z"/></svg>
          審閱佇列
        </a>
        <a class="nav-item" href="tracking.html" data-od-id="nav-tracking">
          計劃追蹤
        </a>


<a class="nav-item" href="settings.html" data-od-id="nav-settings">
          <svg class="ic" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 14.5a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13zM6.5 8a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0z"/></svg>
          偏好設定
        </a>
      </nav>
      <div class="rail-foot rail-foot--user" aria-label="目前使用者">
        <div class="rail-user">
          <div class="avatar" data-user-avatar aria-hidden="true">S</div>
          <div class="rail-user-body">
            <div class="rail-user-top">
              <div class="rail-foot-meta" data-user-meta>
                <div class="rail-foot-name">—</div>
                <div class="rail-foot-title">—</div>
              </div>
              <button type="button" class="btn btn-sm btn-ghost btn-logout" data-logout title="登出">登出</button>
            </div>
            <div class="rail-user-role-row">
              <span class="role-badge role-tone-editor" data-user-role-badge>—</span>
              <span class="rail-user-kind" data-user-kind>人員</span>
            </div>
            <div class="rail-user-perms" data-user-perms role="list" aria-label="權限摘要">
              <span class="perm-chip" role="listitem">—</span>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main" data-od-id="main-templates">
      <div class="toolbar" data-od-id="toolbar">
        <div>
          <h1 data-od-id="page-title">章節範本庫</h1>
          <div class="sub">插入結構完整的段落骨架，再填入你的內容</div>
        </div>
        <div class="spacer"></div>
        <div class="search">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="var(--muted)"><path d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>
          <input id="q" type="search" placeholder="搜尋範本…" aria-label="搜尋範本" />
        </div>
        <button type="button" class="btn" id="btn-custom" data-od-id="btn-custom">＋ 自訂範本</button>
      </div>

      <div class="tabs" data-od-id="tabs">
        <button type="button" class="tab on" data-cat="all">全部</button>
        <button type="button" class="tab" data-cat="core">核心章節</button>
        <button type="button" class="tab" data-cat="security">資安／合規</button>
        <button type="button" class="tab" data-cat="growth">成長／實驗</button>
        <button type="button" class="tab" data-cat="platform">平台</button>
        <button type="button" class="tab" data-cat="openspec">OpenSpec</button>
        <button type="button" class="tab" data-cat="delivery">交付</button>
        <button type="button" class="tab" data-cat="research">研究</button>
      </div>

      <div class="content">
        <div class="filters" style="padding-top:12px">
          <span class="mono" id="count">12 個範本</span>
          <span class="spacer"></span>
          <span class="hint" style="margin:0">點卡片可預覽並插入目前 PRD</span>
        </div>
        <div class="grid-cards" id="grid" data-od-id="template-grid"></div>
      </div>
    </main>
  </div>
</div>

<div class="modal-back" id="modal" data-od-id="modal-tpl">
  <div class="modal" role="dialog" style="width:min(560px,100%)">
    <header>
      <h3 id="m-title">範本預覽</h3>
      <button type="button" class="btn btn-ghost btn-sm" id="m-close">關閉</button>
    </header>
    <div class="body">
      <p id="m-desc" style="margin:0 0 12px;color:var(--muted);font-size: var(--fs-3)"></p>
      <pre id="m-body" style="margin:0;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-family:var(--mono);font-size: var(--fs-2);white-space:pre-wrap;line-height:1.5;max-height:280px;overflow:auto"></pre>
    </div>
    <footer>
      <button type="button" class="btn btn-ghost" id="m-delete" style="color:var(--warn,#d9534f)">一鍵移除範本</button>
      <div style="flex:1"></div>
      <button type="button" class="btn" id="m-copy">複製 Markdown</button>
      <a class="btn btn-primary" href="editor.html" id="m-insert">插入編輯器</a>
    </footer>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="/src/pages/templates.ts"></script>
</body>
</html>
