[package]
name = "specforge"
version = "1.1.0"
description = "PRD 開發監控台 —— 本機優先的開發專案工作台"
authors = ["ShiGaChenTW"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "specforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 刻意不引入 tauri-plugin-shell。
# 那個 plugin 是設計給「前端呼叫 shell」的，即使配 allowlist，
# 參數仍然由前端組。這裡的所有外部程式呼叫都在 Rust 裡把參數寫死，
# 前端只能說「對哪個專案做這件已列舉的事」。見 docs/BRIDGE.md §3.1。

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
