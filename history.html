<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>提交與 Diff · Anchorline</title>
<link rel="stylesheet" href="shared.css" />
<script>(function(){try{var t=localStorage.getItem("anchorline:theme")||localStorage.getItem("specforge:theme");if(t==="warp")t="terminal";if(t==="claude")t="kami";var m={kami:["light","#f5f4ed"],github:["dark","#0d1117"],terminal:["dark","#0d0b08"]};if(!m[t])t="github";var r=document.documentElement;r.setAttribute("data-theme",t);r.style.colorScheme=m[t][0];r.style.background=m[t][1];}catch(e){document.documentElement.setAttribute("data-theme","github");}})();</script>
<style>
  .hv-shell {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    min-height: 0;
    flex: 1;
    height: 100%;
  }
  @media (max-width: 820px) {
    .hv-shell { grid-template-columns: 1fr; }
    .hv-commits { max-height: 28vh; }
  }
  .hv-commits, .hv-main { min-height: 0; overflow: auto; }
  .hv-commits { border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; }
  .hv-main { background: var(--bg); display: flex; flex-direction: column; }
  .hv-tabs { display: flex; gap: 2px; padding: 8px 10px 0; }
  .hv-tab {
    border: 1px solid transparent;
    border-bottom: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: var(--fs-2);
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
  }
  .hv-tab[aria-selected="true"] {
    background: var(--bg);
    color: var(--fg);
    border-color: var(--border);
  }
  .hv-filter {
    margin: 8px 10px;
    width: calc(100% - 20px);
    font: inherit;
    font-size: var(--fs-2);
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
  }
  .hv-list { flex: 1; overflow: auto; padding: 0 6px 10px; }
  .hv-commit {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 8px;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    padding: 8px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .hv-commit:hover { background: var(--inset); }
  .hv-commit[aria-current="true"] { background: color-mix(in oklab, var(--accent) 18%, var(--surface)); }
  .hv-av {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--inset); color: var(--muted);
    font-size: 11px; font-weight: 700;
    display: grid; place-items: center;
  }
  .hv-sub { font-size: var(--fs-3); font-weight: 600; line-height: 1.35; }
  .hv-meta-line { font-size: var(--fs-1); color: var(--muted); margin-top: 2px; }

  .hv-head {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  .hv-title { font-size: var(--fs-5); font-weight: 700; line-height: 1.35; margin: 0 0 6px; }
  .hv-bodytxt { font-size: var(--fs-2); color: var(--fg-2); white-space: pre-wrap; margin: 0 0 8px; }
  .hv-stat { font-size: var(--fs-2); color: var(--muted); display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .hv-plus { color: var(--success); }
  .hv-minus { color: var(--danger); }

  .hv-split-main {
    display: grid;
    grid-template-columns: minmax(180px, 280px) minmax(0, 1fr);
    min-height: 0;
    flex: 1;
  }
  @media (max-width: 1080px) {
    .hv-split-main { grid-template-columns: 1fr; }
    .hv-files { max-height: 22vh; border-right: 0; border-bottom: 1px solid var(--border); }
  }
  .hv-files { overflow: auto; border-right: 1px solid var(--border); background: var(--surface); }
  .hv-file {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: var(--fs-2);
    font-family: var(--mono);
    padding: 6px 12px;
    cursor: pointer;
  }
  .hv-file:hover { background: var(--inset); }
  .hv-file[aria-current="true"] { background: color-mix(in oklab, var(--accent) 14%, var(--surface)); }
  .hv-file .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hv-nd { font-variant-numeric: tabular-nums; color: var(--muted); }
  .hv-nd b { font-weight: 600; }
  .hv-nd .p { color: var(--success); }
  .hv-nd .m { color: var(--danger); }

  .hv-diff { overflow: auto; min-height: 0; display: flex; flex-direction: column; }
  .hv-diff-bar {
    display: flex; justify-content: flex-end; gap: 6px;
    padding: 6px 10px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 1;
  }
  .hv-mode {
    font: inherit; font-size: var(--fs-1); font-weight: 600;
    padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); color: var(--muted); cursor: pointer;
  }
  .hv-mode[aria-pressed="true"] { color: var(--fg); background: var(--inset); }

  .hv-meta {
    padding: 8px 12px; font-family: var(--mono); font-size: 11px;
    color: var(--muted); white-space: pre-wrap; border-bottom: 1px solid var(--border);
  }
  .hv-body { font-family: var(--mono); font-size: 12px; line-height: 1.5; }
  .hv-ln, .hv-split { display: grid; }
  .hv-ln { grid-template-columns: 44px 44px 16px minmax(0, 1fr); }
  .hv-no { color: var(--muted); text-align: right; padding: 0 8px; user-select: none; font-variant-numeric: tabular-nums; }
  .hv-mk { text-align: center; color: var(--muted); user-select: none; }
  .hv-tx { white-space: pre; padding-right: 12px; }
  .hv-ln--add, .hv-cell--add { background: color-mix(in oklab, var(--success) 16%, transparent); }
  .hv-ln--del, .hv-cell--del { background: color-mix(in oklab, var(--danger) 16%, transparent); }
  .hv-ln--hunk { background: color-mix(in oklab, var(--accent) 10%, transparent); color: var(--muted); }
  .hv-ln--hunk .hv-tx { grid-column: 2 / -1; }
  .hv-kw { color: color-mix(in oklab, var(--accent) 70%, var(--fg)); }
  .hv-split { grid-template-columns: 1fr 1fr; }
  .hv-cell { display: grid; grid-template-columns: 44px minmax(0, 1fr); min-width: 0; }
  .hv-cell--empty { background: color-mix(in oklab, var(--muted) 8%, transparent); }
  .hv-empty { padding: 24px; color: var(--muted); }

  .hv-note {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 8px 12px 12px;
  }
  .hv-note-tabs { display: flex; gap: 6px; margin-bottom: 6px; }
  .hv-note textarea, .hv-preview {
    width: 100%; min-height: 72px; resize: vertical;
    font: inherit; font-size: var(--fs-3); line-height: 1.55;
    padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg);
  }
  .hv-preview { min-height: 72px; overflow: auto; }
  .hv-note-foot { display: flex; justify-content: flex-end; margin-top: 6px; }
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <aside class="rail">
      <div class="rail-brand">
        <div class="rail-logo">AL</div>
        <div class="rail-brand-text">
          <strong>Anchorline</strong>
          <span>anchorline.local</span>
        </div>
      </div>
      <div class="rail-theme-row">
        <div class="theme-switch rail-theme-switch" data-theme-switch data-od-id="theme-switch" role="group" aria-label="設計主題">
          <button type="button" data-theme-value="kami" aria-pressed="false">LIGHT</button>
          <button type="button" data-theme-value="github" aria-pressed="true">DARK</button>
          <button type="button" data-theme-value="terminal" aria-pressed="false">TERMINAL</button>
        </div>
      </div>
      <nav class="rail-nav">
        <div class="nav-label">工作區</div>
        <a class="nav-item" href="tracking.html">計劃追蹤</a>
        <a class="nav-item active" href="history.html">提交與 Diff</a>
      </nav>
      <div class="rail-foot rail-foot--user" aria-label="目前使用者">
        <div class="rail-user">
          <div class="avatar" data-user-avatar aria-hidden="true">S</div>
          <div class="rail-user-body">
            <div class="rail-user-top">
              <div class="rail-foot-meta" data-user-meta>
                <div class="rail-foot-name">—</div>
                <div class="rail-foot-title">—</div>
              </div>
              <button type="button" class="btn btn-sm btn-ghost btn-logout" data-logout title="登出">登出</button>
            </div>
            <div class="rail-user-role-row">
              <span class="role-badge role-tone-editor" data-user-role-badge>—</span>
              <span class="rail-user-kind" data-user-kind>人員</span>
            </div>
            <div class="rail-user-perms" data-user-perms role="list" aria-label="權限摘要">
              <span class="perm-chip" role="listitem">—</span>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <main class="main" style="overflow:hidden;display:flex;flex-direction:column">
      <div class="toolbar context-toolbar context-surface-toolbar" data-context="history">
        <div class="context-frame-top">
          <span class="context-kicker">10 / HISTORY</span>
          <span class="context-state">READ</span>
        </div>
        <div class="context-title-block">
          <h1 id="page-title">提交與 Diff</h1>
          <div class="sub" id="page-sub">看這個專案實際發生過什麼。不從這裡 commit 或 push。</div>
        </div>
        <div class="context-frame-bottom">
          <span class="context-path" id="page-path">project / history</span>
          <div class="context-actions">
            <button type="button" class="btn" id="btn-refresh">重新整理</button>
          </div>
        </div>
      </div>
      <div class="content" style="padding:0;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column">
        <div class="hv-shell">
          <section class="hv-commits" aria-label="提交列表">
            <div class="hv-tabs" role="tablist">
              <button type="button" class="hv-tab" role="tab" id="tab-changes" aria-selected="false">Changes</button>
              <button type="button" class="hv-tab" role="tab" id="tab-history" aria-selected="true">History</button>
            </div>
            <input class="hv-filter" id="commit-filter" type="search" placeholder="篩選已載入的提交…" />
            <div class="hv-list" id="commit-list"></div>
          </section>
          <section class="hv-main" aria-label="差異">
            <div class="hv-head" id="commit-head"></div>
            <div class="hv-split-main">
              <div class="hv-files" id="file-list"></div>
              <div class="hv-diff">
                <div class="hv-diff-bar">
                  <button type="button" class="hv-mode" id="mode-unified" aria-pressed="true">Unified</button>
                  <button type="button" class="hv-mode" id="mode-split" aria-pressed="false">Split</button>
                </div>
                <div id="diff-view"></div>
              </div>
            </div>
            <div class="hv-note">
              <div class="hv-note-tabs">
                <button type="button" class="hv-mode" id="note-write" aria-pressed="true">Write</button>
                <button type="button" class="hv-mode" id="note-preview" aria-pressed="false">Preview</button>
              </div>
              <textarea id="note-text" placeholder="對這個提交留一句本機註解。不會送到遠端。"></textarea>
              <div class="hv-preview mdv-prose" id="note-preview-pane" hidden></div>
              <div class="hv-note-foot">
                <button type="button" class="btn btn-sm" id="note-save">儲存註解</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
<script type="module" src="/src/pages/history.ts"></script>
</body>
</html>
